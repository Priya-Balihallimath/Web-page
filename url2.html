<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>An Expert with Caring Heart</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <style>
      /* Your existing CSS remains the same */
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(120deg, #1a1a2e, #16213e);
        animation: bgMove 10s infinite alternate;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      @keyframes bgMove {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 100% 50%;
        }
      }

      .intro {
        text-align: center;
        cursor: pointer;
        transition: all 0.8s ease;
      }

      .intro p {
        color: #fff;
        margin-top: 15px;
        font-size: 18px;
        letter-spacing: 1px;
      }

      .intro.hide {
        opacity: 0;
        transform: scale(0.5);
        pointer-events: none;
      }

      .wrapper {
        width: 100%;
        height: 100%;
        position: relative;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .wrapper.show {
        display: block;
      }

      .inner {
        --w: 100px;
        --h: 150px;
        --translateZ: calc((var(--w) + var(--h)) + 0px);
        --rotateX: -15deg;
        --perspective: 1000px;
        position: absolute;
        width: var(--w);
        height: var(--h);
        top: 25%;
        left: calc(50% - (var(--w) / 2) - 2.5px);
        z-index: 2;
        transform-style: preserve-3d;
        transform: perspective(var(--perspective));
        animation: rotating 20s linear infinite;
      }

      .inner.pause {
        animation-play-state: paused;
      }

      @keyframes rotating {
        from {
          transform: perspective(var(--perspective)) rotateX(var(--rotateX))
            rotateY(0);
        }
        to {
          transform: perspective(var(--perspective)) rotateX(var(--rotateX))
            rotateY(1turn);
        }
      }

      .card {
        position: absolute;
        border: 2px solid rgba(var(--color-card));
        border-radius: 12px;
        overflow: hidden;
        inset: 0;
        transform: rotateY(calc((360deg / var(--quantity)) * var(--index)))
          translateZ(var(--translateZ));
      }

      .img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #0000
          radial-gradient(
            circle,
            rgba(var(--color-card), 0.2) 0%,
            rgba(var(--color-card), 0.6) 80%,
            rgba(var(--color-card), 0.9) 100%
          );
      }

      .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .info {
        text-align: center;
        margin-top: 12px;
        color: #fff;
        opacity: 0;
        transition: opacity 0.4s;
      }

      .card:hover .info {
        opacity: 1;
      }

      .info h3 {
        margin: 5px 0;
        font-size: 16px;
      }

      .info p {
        font-size: 13px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <audio id="bgMusic" loop>
      <source src="3_idiots_guitar.mp3" />
    </audio>

    <div class="intro" id="intro">
      <p>An Expert with Caring Heart</p>
    </div>

    <div class="wrapper" id="carousel">
      <div class="inner" id="inner"></div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Get person parameter from URL
        const params = new URLSearchParams(window.location.search);
        const person = params.get("person") || "guddu"; // default to guddu if not specified

        // Define image sets for each person
        const imageSets = {
          ammu: [
            "g1.jpeg",
            "g2.jpeg",
            "g3.jpeg",
            "g4.jpeg",
            "g5.jpeg",
            "g6.jpeg",
            "g7.jpeg",
            "g8.jpeg",
            "g9.jpeg",
          ],
          guddu: [
            "g1.png",
            "g2.png",
            "g3.png",
            "g4.png",
            "g5.png",
            "g6.png",
            "g7.png",
            "g8.png",
            "g9.png",
          ],
        };

        // Color palette for cards
        const colorPalette = [
          "142, 249, 252",
          "142, 252, 204",
          "142, 252, 157",
          "215, 252, 142",
          "252, 252, 142",
          "252, 208, 142",
          "252, 142, 142",
          "252, 142, 239",
          "204, 142, 252",
          "142, 202, 252",
        ];

        const intro = document.getElementById("intro");
        const carousel = document.getElementById("carousel");
        const inner = document.getElementById("inner");
        const music = document.getElementById("bgMusic");

        // Initially hide carousel
        carousel.style.display = "none";
        music.volume = 0.4;

        // Function to create and populate the carousel
        function createCarousel() {
          const images = imageSets[person] || imageSets.guddu;
          const folderName = person;

          // Set the quantity of cards
          inner.style.setProperty("--quantity", images.length);

          // Clear any existing cards
          inner.innerHTML = "";

          // Create cards for each image
          images.forEach((imageName, index) => {
            const card = document.createElement("div");
            card.className = "card";
            card.style.setProperty("--index", index);
            card.style.setProperty(
              "--color-card",
              colorPalette[index % colorPalette.length]
            );

            const imgDiv = document.createElement("div");
            imgDiv.className = "img";

            const img = document.createElement("img");
            img.src = `${folderName}/${imageName}`;
            img.alt = `Image ${index + 1}`;
            img.onerror = function () {
              // Fallback if image doesn't exist
              console.warn(`Image not found: ${this.src}`);
              this.src =
                "https://via.placeholder.com/100x150/333/fff?text=Image";
            };

            imgDiv.appendChild(img);
            card.appendChild(imgDiv);
            inner.appendChild(card);
          });
        }

        // Initialize carousel on page load
        createCarousel();

        // Click handler for intro
        intro.onclick = () => {
          intro.classList.add("hide");

          setTimeout(() => {
            intro.style.display = "none";
            carousel.style.display = "block";
            music.play();

            setTimeout(() => carousel.classList.add("show"), 50);
          }, 800);
        };

        // Pause/play on hover
        carousel.onmouseenter = () => inner.classList.add("pause");
        carousel.onmouseleave = () => inner.classList.remove("pause");
      });
    </script>
  </body>
</html>
