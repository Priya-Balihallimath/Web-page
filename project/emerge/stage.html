<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QR Hunt Stage</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      .container {
        text-align: center;
        max-width: 600px;
      }

      .stageReveal {
        font-size: 40px;
        letter-spacing: 5px;
        opacity: 0;
        animation: reveal 2s forwards;
      }

      @keyframes reveal {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .questionBox {
        margin-top: 30px;
        padding: 25px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        backdrop-filter: blur(10px);
        animation: fadeUp 1.5s;
      }

      @keyframes fadeUp {
        0% {
          opacity: 0;
          transform: translateY(40px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      input {
        padding: 12px;
        width: 60%;
        font-size: 16px;
        border-radius: 5px;
        border: none;
        margin-top: 15px;
      }

      button {
        padding: 12px 25px;
        margin-top: 15px;
        font-size: 16px;
        background: #ff3c3c;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.1);
        background: red;
      }

      #hint {
        margin-top: 20px;
        font-size: 18px;
        opacity: 0;
        transform: translateY(20px);
        transition: 0.6s;
      }

      #hint.show {
        opacity: 1;
        transform: translateY(0);
      }

      .timer {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 20px;
      }

      .progressBar {
        position: absolute;
        top: 20px;
        left: 30px;
        width: 200px;
        height: 10px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
      }

      #progressFill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ff9c, #00c3ff);
        transition: width 0.8s;
      }

      /* success flash animation */

      .successEffect {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        opacity: 0;
        pointer-events: none;
      }

      @keyframes successAnim {
        0% {
          opacity: 0;
        }
        30% {
          opacity: 0.7;
        }
        100% {
          opacity: 0;
        }
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>

  <body>
    <div class="successEffect" id="successEffect"></div>

    <div class="progressBar">
      <div id="progressFill"></div>
    </div>

    <div class="timer" id="timer">00:00</div>

    <div class="container">
      <h1 class="stageReveal" id="stageTitle">STAGE</h1>

      <h2 id="teamName"></h2>

      <div class="questionBox">
        <p id="question"></p>

        <input id="answer" placeholder="Enter Answer" />

        <br />

        <button onclick="checkAnswer()">Submit</button>

        <p id="hint"></p>
      </div>
    </div>

    <audio id="successSound">
      <source
        src="https://assets.mixkit.co/sfx/preview/mixkit-game-level-completed-2059.mp3"
      />
    </audio>

    <script>
      const params = new URLSearchParams(window.location.search);
      const team = params.get("team");
      const key = params.get("key");

      document.getElementById("teamName").innerText = team
        ? "Team: " + team
        : "";

      const stages = {
        Cm7G2PeBlp: {
          stage: 1,
          question:
            "I help a program choose between two paths.If something is true one action happens otherwise another runs.What am I?",
          answer: "if-else statement",
          hint: "Go where the hero of Kirik Party built his memories.",
        },

        Mkl2hLsRkL: {
          stage: 2,
          question:
            "I convert human readable code into machine language.What am I?",
          answer: "compiler",
          hint: "Every hero begins with knowledge. Find where wisdom lives.",
        },

        CDc6QpDX2h: {
          stage: 3,
          question:
            "Who won Player of the Tournament in the 2011 Cricket World Cup?",
          answer: "yuvraj singh",
          hint: "When lecture ends the real gathering begins here.",
        },
        KXfr75U2tj: {
          stage: 4,
          question: "what will it print <br> print(True + True)",
          answer: "2",
          hint: "Where actors become heroes and the audience becomes the world.<br>Find this place.",
        },
        U1llwsYq61: {
          stage: 5,
          question:
            "What is the output of the following code snippet?print(2 ** 3 ** 2)",
          answer: "512",
          hint: "0s and 1s shape the future here. Find this place.",
        },
        ZyfEMp1H4T: {
          stage: 6,
          question:
            "What is the output of the following code snippet? print('hello' * 3)",
          answer: "hellohellohello",
          hint: "Where leaders are shaped and strategies are born. Find this place.",
        },
        IyTY0gsUJJ: {
          stage: 7,
          question:
            "What is the output of the following code snippet?.  print(len('Python Programming'))",
          answer: "18",
          hint: "Where wheels rest before the journey continues.",
        },
        IFP9qFWCcj: {
          stage: 8,
          question:
            "What is the output of the following code snippet? print(10 // 3)",
          answer: "3",
          hint: "Where the magic of division meets the precision of integers. Find this place.",
        },
        BLZ0ofoeco: {
          stage: 9,
          question:
            "What is the output of the following code snippet? print(5 > 3 and 2 < 4)",
          answer: "true",
          hint: "Every step brings you closer to the next level.",
        },
        PrbViSz5b3: {
          stage: 10,
          question:
            "What is the output of the following code snippet? print('Data' + 'Science')",
          answer: "datascience",
          hint: "Congratulations on reaching the final stage!Find the place where The remover of obstacles waits here.<br>Seek his blessings to move forward",
        },
      };

      let currentStage = stages[key];

      if (currentStage) {
        document.getElementById("stageTitle").innerText =
          "STAGE " + currentStage.stage;
        typeQuestion(currentStage.question);
      } else {
        document.getElementById("stageTitle").innerHTML = "Invalid QR Code";
      }

      function checkAnswer() {
        if (!currentStage) return;

        let userAnswer = document
          .getElementById("answer")
          .value.toLowerCase()
          .trim();

        if (userAnswer === currentStage.answer) {
          let fx = document.getElementById("successEffect");
          fx.style.animation = "none";
          fx.offsetHeight;
          fx.style.animation = "successAnim 1.5s";

          confetti({
            particleCount: 200,
            spread: 120,
            origin: { y: 0.6 },
          });

          document.getElementById("successSound").play();

          let hintBox = document.getElementById("hint");
          hintBox.innerHTML = "✅ Correct!<br><br>Hint: " + currentStage.hint;
          hintBox.classList.add("show");

          let progress = (currentStage.stage / 10) * 100;
          document.getElementById("progressFill").style.width = progress + "%";
        } else {
          alert("Wrong answer! Try again.");
        }
      }

      let seconds = localStorage.getItem("huntTimer") || 0;

      function updateTimer() {
        seconds++;

        localStorage.setItem("huntTimer", seconds);

        let m = Math.floor(seconds / 60);
        let s = seconds % 60;

        document.getElementById("timer").innerHTML =
          m.toString().padStart(2, "0") + ":" + s.toString().padStart(2, "0");
      }

      setInterval(updateTimer, 1000);

      function typeQuestion(text) {
        let q = document.getElementById("question");
        q.innerHTML = "";

        let i = 0;
        let speed = 30;

        function typing() {
          if (i < text.length) {
            q.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
          }
        }

        typing();
      }
    </script>
  </body>
</html>
