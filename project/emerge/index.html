<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QR Hunt</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: whitesmoke;
        overflow: hidden;
      }
      .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("jit.jpeg") center/cover no-repeat;
        z-index: -2;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.65);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .title {
        font-size: 60px;
        letter-spacing: 6px;
        opacity: 0;
        animation: titleReveal 3s forwards;
      }

      #welcome {
        display: none;
        animation: fadeIn 2s;
      }

      input {
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        margin-top: 20px;
      }

      button {
        padding: 12px 25px;
        font-size: 16px;
        margin-top: 20px;
        border: none;
        border-radius: 6px;
        background: #ff3c3c;
        color: white;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        transform: scale(1.1);
        background: #ff0000;
      }
      #instruction {
        display: none;
        margin-top: 25px;
        font-size: 20px;
        animation: fadeIn 2s;
      }

      @keyframes titleReveal {
        0% {
          opacity: 0;
          transform: scale(0.6);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes zoomBg {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.1);
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="overlay" id="intro">
      <h1 class="title">QR Hunt</h1>
      <p>Tech Fest Challenge</p>
    </div>

    <div class="overlay" id="welcome">
      <h2>
        Welcome to <br />
        JAIN INSTITUTION OF TECHNOLOGY
      </h2>
      <h2>EMERGE</h2>
      <h3>QR HUNT</h3>
      <p>Scan • Solve • Win</p>
      <input id="teamName" placeholder="Enter Team Name" />
      <br />
      <button onclick="startGame()">Start Hunt</button>
      <p id="instruction">
        Go to the <b>Main Gate </b>and scan the QR code to begin the hunt.
      </p>
    </div>

    <script>
      setTimeout(() => {
        document.getElementById("intro").style.display = "none";
        document.getElementById("welcome").style.display = "flex";
      }, 4000);
      function startGame() {
        let team = document.getElementById("teamName").value;
        if (team == "") {
          alert("Please enter a team name");
          return;
        }

        localStorage.setItem("teamName", team);
        document.getElementById("instruction").style.display = "block";
      }
    </script>
  </body>
</html>
