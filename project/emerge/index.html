<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QR Hunt</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: whitesmoke;
        overflow: hidden;
      }

      .background {
        position: fixed;
        width: 100%;
        height: 100%;
        background: url("jit.jpeg") center/cover no-repeat;
        z-index: -2;
      }

      .overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.65);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .title {
        font-size: 60px;
        letter-spacing: 6px;
        opacity: 0;
        animation: titleReveal 3s forwards;
      }

      #welcome {
        display: none;
        animation: fadeIn 2s;
      }

      input {
        padding: 12px;
        font-size: 16px;
        border-radius: 5px;
        margin-top: 15px;
        border: none;
      }

      button {
        padding: 12px 25px;
        margin-top: 15px;
        border-radius: 6px;
        border: none;
        background: #ff3c3c;
        color: white;
        cursor: pointer;
      }

      button:hover {
        transform: scale(1.1);
      }

      #instruction {
        display: none;
        margin-top: 20px;
        font-size: 20px;
      }

      #password,
      #verifyBtn {
        display: none;
      }

      @keyframes titleReveal {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="background"></div>

    <!-- Intro -->
    <div class="overlay" id="intro">
      <h1 class="title">QR Hunt</h1>
      <p>Tech Fest Challenge</p>
    </div>

    <!-- Main Screen -->
    <div class="overlay" id="welcome">
      <h2>Welcome to <br />JAIN INSTITUTION OF TECHNOLOGY</h2>
      <h2>EMERGE</h2>
      <h3>QR HUNT</h3>
      <p>Scan • Solve • Win</p>

      <input type="text" id="teamName" placeholder="Enter your team name" />
      <button onclick="startGame()">Start Hunt</button>

      <p id="instruction">
        Go to the <b>Main Gate</b> and enter the password found there.
      </p>

      <input type="password" id="password" placeholder="Enter password" />
      <button id="verifyBtn" onclick="verifyPassword()">Verify</button>
    </div>

    <script>
      setTimeout(() => {
        document.getElementById("intro").style.display = "none";
        document.getElementById("welcome").style.display = "flex";
      }, 4000);

      const csvUrl =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCugogQCrAGkt-7zHuGEm_ll8oeTToALiQ0voOe5zeghtVIjH7diwt1VZB-puGj7DY7b2rqyMKvQAI/pub?output=csv";

      // STEP 1: Start Game (only team name)
      function startGame() {
        let team = document.getElementById("teamName").value.trim();

        if (team === "") {
          alert("Please enter a team name");
          return;
        }

        localStorage.setItem("teamName", team);

        document.getElementById("instruction").style.display = "block";
        document.getElementById("password").style.display = "block";
        document.getElementById("verifyBtn").style.display = "block";
      }

      // STEP 2: Verify Password
      async function verifyPassword() {
        let team = localStorage.getItem("teamName");
        let password = document.getElementById("password").value.trim();

        if (password === "") {
          alert("Enter password");
          return;
        }

        try {
          const response = await fetch(csvUrl);
          const data = await response.text();

          const rows = data
            .trim()
            .split("\n")
            .map((row) => row.split(",").map((cell) => cell.trim()));

          let valid = false;

          for (let i = 1; i < rows.length; i++) {
            if (!rows[i][0]) continue;

            let sheetTeam = rows[i][0];
            let sheetStage = rows[i][1];
            let sheetPassword = rows[i][2];

            if (
              sheetTeam.toLowerCase().trim() === team.toLowerCase().trim() &&
              sheetPassword.trim() === password
            ) {
              valid = true;
              break;
            }
          }

          if (valid) {
            window.location.href =
              "scanner.html?team=" + encodeURIComponent(team);
          } else {
            alert("Wrong password. Try again!");
          }
        } catch (error) {
          console.error(error);
          alert("Error connecting to server");
        }
      }
    </script>
  </body>
</html>
