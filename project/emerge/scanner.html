<!doctype html>
<html>
  <head>
    <title>Scan QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
      body {
        background: black;
        color: white;
        text-align: center;
        font-family: Arial;
      }

      #reader {
        width: 300px;
        margin: auto;
        margin-top: 50px;
      }
    </style>
  </head>

  <body>
    <h1>Scan QR Code</h1>
    <div id="reader"></div>

    <script>
      let scanned = false;

      function onScanSuccess(decodedText) {
        if (scanned) return;
        scanned = true;

        let stage = decodedText.trim(); // from QR (like "1")

        localStorage.setItem("stage", stage);

        window.location.href = "question.html";
      }

      let scanner = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: 250,
      });

      scanner.render(onScanSuccess);
    </script>
  </body>
</html>
