<!doctype html>
<html>
  <head>
    <title>Scan Qr</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
      body {
        background: black;
        color: white;
        text-align: center;
        font-family: Arial;
        animation: fadeIn 1.5s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      #reader {
        width: 300px;
        margin: auto;
        margin-top: 50px;
        border: 3px solid #00ffcc;
        border-radius: 10px;
        box-shadow: 0 0 20px #00ffcc;
      }
      .scanner-container {
        position: relative;
        width: 300px;
        margin: auto;
      }
      .scan-line {
        position: absolute;
        width: 100%;
        height: 4px;
        background: #00ffcc;
        top: 0;
        animation: scanMove 2s linear infinite;
      }
      @keyframes scanMove {
        0% {
          top: 0;
        }
        50% {
          top: 95%;
        }
        100% {
          top: 0;
        }
      }
    </style>
  </head>
  <body>
    <h1>Scan QR Code</h1>
    <div class="scanner-container">
      <div id="reader"></div>
      <div class="scan-line"></div>
    </div>
    <script>
      function onScanSuccess(decodedText) {
        window.location.href = decodedText;
      }
      let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      scanner.render(onScanSuccess);
    </script>
  </body>
</html>
