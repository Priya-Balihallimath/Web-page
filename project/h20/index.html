<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Water Tanker Alert</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle, #1f4037, #99f2c8);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
      }
      .scene {
        display: none;
        text-align: center;
      }
      .scene.active {
        display: block;
      }
      h1 {
        margin-bottom: 20px;
      }
      .container {
        text-align: center;
      }

      .tanker {
        width: 220px;
        height: 300px;
        border: 4px solid white;
        border-radius: 30px;
        margin: auto;
        position: relative;
        overflow: hidden;
      }
      .cap {
        width: 580px;
        height: 20px;
        background: #555;
        border-radius: 10px;
        position: absolute;
        top: auto;
        left: 50%;
        transform: translateX(-50%);
      }
      .water {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 70%;
        background: #2ecc71;
        transition: height 2s;
        background: 1s;
      }
      .face {
        position: absolute;
        top: 70px;
        width: 100%;
      }
      .eyes {
        display: flex;
        justify-content: center;
        gap: 30px;
      }
      .eye {
        width: 22px;
        height: 22px;
        background: white;
        border-radius: 50%;
        position: relative;
      }

      eye::after {
        content: "";
        width: 10px;
        height: 10px;
        background: black;
        border-radius: 50%;
        position: absolute;
        top: 6px;
        left: 6px;
      }
      .mouth {
        margin: 20px auto 0;
        width: 60px;
        height: 10px;
        border-bottom: 5px solid #000;
        border-radius: 0 0 40px 40px;
        transition: all 0.5s;
      }
      .sad {
        border-bottom: none;
        border-top: 5px solid #000;
        border-radius: 40px 40px 0 0;
      }
      .neutral {
        width: 50px;
        height: 5px;
        background: black;
        border: none;
        border-radius: 5px;
      }
      .status {
        margin-top: 20px;
        font-size: 22px;
      }
      .warning {
        font-size: 26px;
        margin-top: 20px;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      .village {
        font-size: 80px;
        margin-top: 20px;
      }
      .alert {
        font-size: 28px;
        color: yellow;
        animation: blink 1s infinite;
      }
    </style>
  </head>
  <body>
    <div class="container"></div>
    <!--1-->
    <div class="scene active" id="scene-1">
      <h1>Water Tanker Level:Normal</h1>
      <div class="tanker">
        <div class="cap"></div>
        <div class="water" id="water1"></div>
        <div class="face">
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="mouth" id="mouth"></div>
        </div>
      </div>
    </div>

    <div class="scene" id="scene-2">
      <h1>Water Level Decresing...</h1>
      <div class="tanker">
        <div
          class="water"
          id="water2"
          style="height: 40%"
          ;
          background:#f1c40f;
        ></div>
      </div>
    </div>

    <div class="scene" id="scene-3">
      <h1>🚨Low Water Level Detected🚨</h1>
      <div class="tanker">
        <div class="water" style="height: 15%; background: #e74c3c"></div>
      </div>
      <div class="warning">Sensor Alert Activated</div>
    </div>

    <div class="scene" id="scene-4">
      <h1>Village Alert System</h1>
      <div class="village">🏡</div>
      <div class="alert">🔔Warning sent to the village</div>
    </div>
    <!--5-->
    <div class="scene" id="scene-5">
      <h1>⌚Early Detection Saves Water & Lives</h1>
      <h2>"Early warning is a promise of water for tomorrow".</h2>
    </div>
    <audio id="alarm" src="H2O/warning .mp3"></audio>

    <script>
      let level = 70;
      const scenes = document.querySelectorAll(".scene");
      const alarm = document.getElementById("alarm");
      const water = document.getElementById("water");
      const mouth = document.getElementById("mouth");
      const status = document.getElementById("status");
      let current = 0;

      function nextScene() {
        scenes[current].classList.remove("active");
        current++;
        if (current < scenes.length) {
          mouth.className = "mouth";
          scenes[current].classList.add("active");
          if (current < scenes.length) {
            scenes[current].classList.add("active");
            mouth.className = "mouth neutral";
            if (current === 2) alarm.play();
            mouth.className = "mouth sad";
            status.innerText = "Water Level Critical";
          }
        }
      }
      setTimeout(nextScene, 3000);
      setTimeout(nextScene, 6000);
      setTimeout(nextScene, 9000);
      setTimeout(nextScene, 12000);
    </script>
  </body>
</html>
