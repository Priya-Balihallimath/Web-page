<!DOCTYPE html>>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>An Expert with Caring Heart</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        color: white;
        height: 100vh;
        background:radial-gradient(circle at top,#1e293b,#020617);
        font-family: Arial, Helvetica, sans-serif;
      }
      .wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .inner {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        max-width: 90px;
        --quantity: 10;
      }
      @keyframes rotate {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(360deg);
        }
        
      }
      .card {
        width: 120px;
        height: 180px;
        background-color: rgb(var(--color-card));
        border-radius: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        color: #333;
        text-align: center;
        rotateY(calc(var(--index) * 360deg ))
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.6);
        
      .card:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
      }
      .img {
        width: 80px;
        height: 80px;
        background: rgba(225, 225, 255, 0.7);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
         </style>
  </head>
  <body>
    <audio id=""
    <div class="wrapper">
      <div class="inner">
        <div class="card" style="--index: 0; --color-card: 142, 249, 252">
          <div class="img">
            <img src=" gp/g1.png"  alt ="image-1">
      </div>
    </div>
     <div class="wrapper">
      <div class="inner">
        <div class="card" style="--index: 1; --color-card: 142, 249, 252">
          <div class="img">

            <img src=" gp/g2.png"  alt ="image-2">
      </div>
    </div>
    <div class="wrapper">
      <div class="inner">
        <div class="card" style="--index: 3; --color-card: 142, 249, 252">
          <div class="img">

            <img src=" gp/g3.png"  alt ="image-3">
      </div>
    </div>
    <div class="wrapper">
      <div class="inner">
        <div class="card" style="--index: 4; --color-card: 142, 249, 252">
          <div class="img">

            <img src=" gp/g4.png"  alt ="image-4">
      </div>
    </div>
<div class="wrapper">
      <div class="inner">
        <div class="card" style="--index: 5; --color-card: 142, 249, 252">
          <div class="img">

            <img src=" gp/g5.png"  alt ="image-5">
      </div>
    </div>
  </body>
</html>
