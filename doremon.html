<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Doraemon</title>
    <style>
                           body {
                               background-color: #dff3ff;
                               overflow:hidden;
                               font font-family: Arial;
                           }
                          .doraemon{
                           position: absolute;
                           width: 180px;
                           height:220px;
                           left: 0;
                        top: 50%;
                        transform: translateY(-50%);
                        animation-duration: 6slinear infinite;
                        }
                        @keyframes move{
                            0%{left:-150px;}
                            100%{left:100%;}
                        }
                        .body{
                            width:150px;
                            height:180px;
                            background: #0099ff;
                            border radius:70px;
                            position:relative;
                        }
                        .face{
                          width: 140px;
                          height:140px;
                          background: white;
                          border-radius: 70%;
                          position:absolute
                  top:-50px;
                  left:5px;
                  border:3px solid #000;
                        }
                        .eye.left{left:28px;}
                        .eye.right{right: 28px;}
                        .pupil{width: 10px;
                      height: 14px;
                  background: black;
                  border-radius;;50%;
                  position:absolute;
                  top:15px;
                  left:11px;}
                  .nose{
                      width:20px;
                      height:20px;
                  background:red;
                  border-radius:50%;
                  position:absolute;
                  top:40px;
                  left: 60px;
                  border:2pxsolid #000;
                  }
                  .mouth{width: 80px;
                  height: 70px;
                  background:yellow;
                  border:2px solid #000;
                  border-radius:50%;
                  position:absolute;
                  bottom;10px;
                  left:58px;
                  }
                  .controls{

                      position: fixed;
                  bottom:20px;
                  left: 50%;
                  transform: translateY(-50%);
                  display: flex;
                  gap:25px;
                  }
                  button{
                      padding:14px 34px;
                      border: none;
                  border-radius:40px;
                  font-size:17px;
                  font-weight: bold;
                  cursor:pointer;
                  background:linear-gradient(#ffe066,#ffca2c);
            color:#5b4100;
            box-shadow: 0 5px 12px
            rgba(0,0,0,0.18),
            inset 0 3px 5px rgba(255,255,255,0.7);
            position:relative;
            transition:0.3s;
                  }
                  button::before{
                    content:"";
                    position:absolute;
                    top: 6px;
                left:50%;
            transform:translateX(-50%) ;
            width: 60%;
            height: 12px;
            background: rgba(255,255,255,0.6);
            border-radius: 50px;
                }
                button:hover{
                    transform:translateY(-4px);
                    box-shadow: 0 8px 15px rgba(0,0,0,0.25),
                    inset 0 3px 7px rgba(255,255,255,0.9);
                    background:linear-gradient(#ffe889,#ffcf38);
                }
                button:active{
                  transform:translateY(0px)
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
                }
    </style>
  </head>
  <body>
    <audio
      id="doremon.mp3"
      src="C:\Users\Admin\Desktop\pri\doremon.mp3"
      loop
    ></audio>
    <div class="Doraemon" id="dora">
      <div class="body"></div>
      <div class="face">
        <div class="eye left">
          <div class="pupil"></div>
        </div>
        <div class="eye right">
          <div class="pupil"></div>
        </div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>
      <div class="bell"></div>
    </div>
    <div class="controls">
      <button id="playBtn">▶Play</button>
      <button id="pauseBtn">⏸Pause</button>
    </div>
    <script>
              const music=document.getElementById("doremon.mp3");
              const playBtn=document.getElementById("playBtn");
              constpauseBtn=document.getElementById("pauseBtn");

      playBtn.onclick=()=>music.play();
      pauseBtn.onclick=()=>music.pause();
      document.addEventListener("mousemove",(e)=>{
          const pupils=
          document.querySelectorAll(".pupil");
          pupils.forEach(p=>{
              p.style.transform=translate(${(e.clientX/100)}
          px,${(e.clientY/150)}px);
          })
      })
    </script>
  </body>
</html>
